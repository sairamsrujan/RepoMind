<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 854 676" width="854" height="676" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="854" height="676" rx="10" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- ================= BAND 1 · INGEST ================= -->
  <rect x="24" y="24" width="806" height="120" rx="8" fill="#f8fafc" stroke="#e9edf2"/>
  <rect x="24" y="24" width="4" height="120" rx="2" fill="#2563eb"/>
  <text x="44" y="72" font-size="13" font-weight="700" fill="#2563eb">1 · INGEST</text>
  <text x="44" y="90" font-size="10.5" fill="#94a3b8">once per</text>
  <text x="44" y="104" font-size="10.5" fill="#94a3b8">repository</text>

  <rect x="126" y="48" width="150" height="72" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text x="201" y="80" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">GitHub repository</text>
  <text x="201" y="98" text-anchor="middle" font-size="10.5" fill="#64748b">public URL</text>

  <rect x="306" y="48" width="240" height="72" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text x="426" y="72" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">REST + GraphQL</text>
  <text x="426" y="90" text-anchor="middle" font-size="10.5" fill="#64748b">commits · releases</text>
  <text x="426" y="106" text-anchor="middle" font-size="10.5" fill="#64748b">PRs · reviews · issues</text>

  <rect x="576" y="48" width="240" height="72" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text x="696" y="80" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">raw JSON</text>
  <text x="696" y="98" text-anchor="middle" font-size="10.5" fill="#64748b">checkpointed · resumable</text>

  <line x1="276" y1="84" x2="306" y2="84" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="546" y1="84" x2="576" y2="84" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>

  <line x1="473" y1="144" x2="473" y2="190" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ================= BAND 2 · PROCESS ================= -->
  <rect x="24" y="190" width="806" height="100" rx="8" fill="#f8fafc" stroke="#e9edf2"/>
  <rect x="24" y="190" width="4" height="100" rx="2" fill="#7c3aed"/>
  <text x="44" y="234" font-size="13" font-weight="700" fill="#7c3aed">2 · PROCESS</text>
  <text x="44" y="252" font-size="10.5" fill="#94a3b8">shape the</text>
  <text x="44" y="266" font-size="10.5" fill="#94a3b8">evidence</text>

  <rect x="193" y="208" width="250" height="64" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text x="318" y="234" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">chunker</text>
  <text x="318" y="252" text-anchor="middle" font-size="10.5" fill="#64748b">metadata-tagged chunks</text>

  <rect x="473" y="208" width="280" height="64" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text x="613" y="234" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">linker</text>
  <text x="613" y="252" text-anchor="middle" font-size="10.5" fill="#64748b">issue ↔ PR ↔ commit ↔ release</text>

  <line x1="473" y1="290" x2="473" y2="336" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ================= BAND 3 · INDEX ================= -->
  <rect x="24" y="336" width="806" height="100" rx="8" fill="#f8fafc" stroke="#e9edf2"/>
  <rect x="24" y="336" width="4" height="100" rx="2" fill="#0891b2"/>
  <text x="44" y="380" font-size="13" font-weight="700" fill="#0891b2">3 · INDEX</text>
  <text x="44" y="398" font-size="10.5" fill="#94a3b8">reused unless</text>
  <text x="44" y="412" font-size="10.5" fill="#94a3b8">config changes</text>

  <rect x="166" y="354" width="200" height="64" rx="8" fill="#ecfeff" stroke="#0891b2"/>
  <text x="266" y="380" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">ChromaDB</text>
  <text x="266" y="398" text-anchor="middle" font-size="10.5" fill="#64748b">dense vectors</text>

  <rect x="391" y="354" width="190" height="64" rx="8" fill="#ecfeff" stroke="#0891b2"/>
  <text x="486" y="380" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">BM25</text>
  <text x="486" y="398" text-anchor="middle" font-size="10.5" fill="#64748b">sparse lexical</text>

  <rect x="606" y="354" width="200" height="64" rx="8" fill="#ecfeff" stroke="#0891b2"/>
  <text x="706" y="380" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">evolution graph</text>
  <text x="706" y="398" text-anchor="middle" font-size="10.5" fill="#64748b">linked records · opt-in</text>

  <!-- ================= BAND 4 · QUERY ================= -->
  <rect x="24" y="482" width="806" height="170" rx="8" fill="#f8fafc" stroke="#e9edf2"/>
  <rect x="24" y="482" width="4" height="170" rx="2" fill="#16a34a"/>
  <text x="44" y="556" font-size="13" font-weight="700" fill="#16a34a">4 · QUERY</text>
  <text x="44" y="574" font-size="10.5" fill="#94a3b8">every</text>
  <text x="44" y="588" font-size="10.5" fill="#94a3b8">question</text>

  <rect x="116" y="527" width="94" height="80" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text x="163" y="573" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">Question</text>

  <rect x="228" y="527" width="144" height="80" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text x="300" y="552" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">Hybrid retrieval</text>
  <text x="300" y="570" text-anchor="middle" font-size="10" fill="#64748b">dense + BM25 → RRF</text>
  <text x="300" y="586" text-anchor="middle" font-size="10" fill="#64748b">→ MMR → rerank</text>
  <text x="300" y="600" text-anchor="middle" font-size="10" fill="#94a3b8">top 6 chunks</text>

  <rect x="390" y="527" width="120" height="80" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text x="450" y="560" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">Generation</text>
  <text x="450" y="578" text-anchor="middle" font-size="10" fill="#64748b">answer with</text>
  <text x="450" y="592" text-anchor="middle" font-size="10" fill="#64748b">inline citations</text>

  <rect x="528" y="527" width="110" height="80" rx="8" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="583" y="556" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5b21b6">GUARD</text>
  <text x="583" y="576" text-anchor="middle" font-size="10" fill="#64748b">1 · citations exist</text>
  <text x="583" y="592" text-anchor="middle" font-size="10" fill="#64748b">2 · NLI entails</text>

  <rect x="688" y="527" width="140" height="34" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="758" y="549" text-anchor="middle" font-size="11.5" font-weight="600" fill="#166534">✓ Verified answer</text>

  <rect x="688" y="573" width="140" height="34" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="758" y="595" text-anchor="middle" font-size="11.5" font-weight="600" fill="#991b1b">✗ Honest refusal</text>

  <line x1="210" y1="567" x2="228" y2="567" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="372" y1="567" x2="390" y2="567" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="510" y1="567" x2="528" y2="567" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M638,556 L663,556 L663,544 L688,544" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M638,578 L663,578 L663,590 L688,590" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="663" y="537" text-anchor="middle" font-size="9.5" font-weight="600" fill="#16a34a">pass</text>
  <text x="663" y="606" text-anchor="middle" font-size="9.5" font-weight="600" fill="#dc2626">fail</text>

  <!-- index -> retrieval. Drawn last: it crosses the QUERY band, whose opaque
       background would otherwise paint over this arrow. -->
  <path d="M300,436 L300,527" fill="none" stroke="#94a3b8" stroke-width="1.6"
        stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="310" y="470" font-size="10.5" fill="#64748b">read per question</text>
</svg>
