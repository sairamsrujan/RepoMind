<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <linearGradient id="canvasBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <!-- ================= CANVAS BACKGROUND ================= -->
  <rect width="1280" height="720" fill="url(#canvasBg)"/>

  <!-- ================= HEADER ================= -->
  <text x="640" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">RepoMind — Pipeline Execution Flowchart</text>
  <text x="640" y="50" text-anchor="middle" font-size="11" fill="#64748b">End-to-end execution flow from GitHub repository URL to verified answer or honest refusal</text>

  <!-- ========================================================================= -->
  <!-- ════════════════════ ROW 1: STAGES 1–4 · OFFLINE INDEXING ═══════════════ -->
  <!-- ========================================================================= -->
  <rect x="24" y="64" width="1232" height="268" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <rect x="24" y="64" width="4" height="268" rx="2" fill="#2563eb"/>
  <text x="40" y="86" font-size="11.5" font-weight="700" fill="#2563eb">STAGES 1–4 · OFFLINE INGESTION &amp; INDEXING</text>
  <text x="365" y="86" font-size="10" fill="#64748b">(Runs once per repository · Reused on future queries if manifest matches)</text>

  <!-- Start Circle -->
  <circle cx="54" cy="180" r="9" fill="#0f172a"/>

  <!-- Stage 1: Input -->
  <rect x="80" y="156" width="112" height="48" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="136" y="177" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Paste Repo URL</text>
  <text x="136" y="193" text-anchor="middle" font-size="9" fill="#64748b">core/repo_url.py</text>

  <!-- Stage 1 Decision Diamond: Reusable? -->
  <path d="M208,180 L256,152 L304,180 L256,208 z" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="256" y="176" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Index</text>
  <text x="256" y="189" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">reusable?</text>

  <!-- Stage 2: Ingest (Fetch REST & GraphQL) -->
  <rect x="340" y="156" width="130" height="48" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="405" y="177" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Fetch from GitHub</text>
  <text x="405" y="193" text-anchor="middle" font-size="9" fill="#64748b">REST + GraphQL</text>

  <!-- Stage 3a: Chunk -->
  <rect x="496" y="156" width="112" height="48" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="552" y="177" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Chunk Records</text>
  <text x="552" y="193" text-anchor="middle" font-size="9" fill="#64748b">process/chunker.py</text>

  <!-- Stage 3b: Link Graph -->
  <rect x="634" y="156" width="116" height="48" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="692" y="177" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Build Link Graph</text>
  <text x="692" y="193" text-anchor="middle" font-size="9" fill="#64748b">process/linker.py</text>

  <!-- Stage 4a: Embed -->
  <rect x="776" y="156" width="120" height="48" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.3"/>
  <text x="836" y="177" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Embed Chunks</text>
  <text x="836" y="193" text-anchor="middle" font-size="9" fill="#0891b2">qwen3-embedding</text>

  <!-- Stage 4b: Triple Index Stores -->
  <rect x="922" y="136" width="134" height="26" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="1.2"/>
  <text x="989" y="153" text-anchor="middle" font-size="9.5" font-weight="600" fill="#0891b2">ChromaDB (Dense)</text>

  <rect x="922" y="167" width="134" height="26" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="1.2"/>
  <text x="989" y="184" text-anchor="middle" font-size="9.5" font-weight="600" fill="#0891b2">BM25 (Sparse)</text>

  <rect x="922" y="198" width="134" height="26" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="1.2"/>
  <text x="989" y="215" text-anchor="middle" font-size="9.5" font-weight="600" fill="#0891b2">Evolution Graph</text>

  <!-- Stage 4c: Manifest -->
  <rect x="1082" y="156" width="136" height="48" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.4"/>
  <text x="1150" y="177" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">manifest.json</text>
  <text x="1150" y="193" text-anchor="middle" font-size="9" font-weight="600" fill="#0891b2">status = ready ✓</text>

  <!-- ──── ROW 1 CONNECTORS & FLOW ──── -->
  <!-- Start → Input -->
  <line x1="63" y1="180" x2="80" y2="180" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- Input → Decision Diamond -->
  <line x1="192" y1="180" x2="208" y2="180" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- Decision NO branch → Fetch -->
  <line x1="304" y1="180" x2="340" y2="180" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="314" y="172" font-size="8.5" font-weight="700" fill="#dc2626">No</text>

  <!-- Decision YES branch (Bypass over top clear corridor) -->
  <path d="M256,152 L256,110 L1232,110 L1232,296" fill="none" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="264" y="104" font-size="9" font-weight="700" fill="#16a34a">Yes (Manifest matches fingerprint → reuse index instantly)</text>

  <!-- Fetch → Chunk → Link → Embed -->
  <line x1="470" y1="180" x2="496" y2="180" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="608" y1="180" x2="634" y2="180" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="750" y1="180" x2="776" y2="180" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- Embed → Stores (Fork) -->
  <path d="M896,180 L908,180" fill="none" stroke="#64748b" stroke-width="1.4"/>
  <path d="M908,149 L908,211" fill="none" stroke="#64748b" stroke-width="1.4"/>
  <circle cx="908" cy="180" r="2.5" fill="#64748b"/>
  <line x1="908" y1="149" x2="922" y2="149" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="908" y1="180" x2="922" y2="180" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="908" y1="211" x2="922" y2="211" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- Stores → Manifest (Join) -->
  <path d="M1056,149 L1068,149" fill="none" stroke="#64748b" stroke-width="1.4"/>
  <path d="M1056,180 L1068,180" fill="none" stroke="#64748b" stroke-width="1.4"/>
  <path d="M1056,211 L1068,211" fill="none" stroke="#64748b" stroke-width="1.4"/>
  <path d="M1068,149 L1068,211" fill="none" stroke="#64748b" stroke-width="1.4"/>
  <line x1="1068" y1="180" x2="1082" y2="180" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- Manifest → Ready Exit Point -->
  <path d="M1218,180 L1232,180 L1232,296" fill="none" stroke="#0891b2" stroke-width="1.4"/>

  <!-- Row 1 to Row 2 Transition Badge -->
  <rect x="1106" y="278" width="134" height="26" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="1173" y="295" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1d4ed8">Index Ready on Disk</text>

  <!-- ========================================================================= -->
  <!-- ════════════════════ ROW 2: STAGES 5–7 · ONLINE QUERY PIPELINE ═══════════ -->
  <!-- ========================================================================= -->
  <rect x="24" y="348" width="1232" height="332" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <rect x="24" y="348" width="4" height="332" rx="2" fill="#16a34a"/>
  <text x="40" y="370" font-size="11.5" font-weight="700" fill="#16a34a">STAGES 5–7 · ONLINE RETRIEVAL, GENERATION &amp; VERIFICATION</text>
  <text x="480" y="370" font-size="10" fill="#64748b">(Executes on every question · Fully offline &amp; verifiable)</text>

  <!-- Stage 5: Ask Question Start -->
  <circle cx="54" cy="466" r="8" fill="#0f172a"/>
  <rect x="74" y="442" width="100" height="48" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
  <text x="124" y="463" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a">Ask Question</text>
  <text x="124" y="478" text-anchor="middle" font-size="8.5" fill="#64748b">Natural Query</text>

  <!-- Stage 5: Embed Question -->
  <rect x="194" y="442" width="108" height="48" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="248" y="463" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a">Embed Question</text>
  <text x="248" y="478" text-anchor="middle" font-size="8.5" fill="#2563eb">qwen3-embedding</text>

  <!-- Stage 5: Dense Search (Chroma) -->
  <rect x="336" y="410" width="118" height="42" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="395" y="428" text-anchor="middle" font-size="10" font-weight="700" fill="#1d4ed8">Dense · ChromaDB</text>
  <text x="395" y="442" text-anchor="middle" font-size="8.5" fill="#64748b">cosine · top 30</text>

  <!-- Stage 5: Sparse Search (BM25) -->
  <rect x="336" y="476" width="118" height="42" rx="7" fill="#eff6ff" stroke="#ea580c" stroke-width="1.2"/>
  <text x="395" y="494" text-anchor="middle" font-size="10" font-weight="700" fill="#ea580c">Sparse · BM25</text>
  <text x="395" y="508" text-anchor="middle" font-size="8.5" fill="#64748b">lexical · top 30</text>

  <!-- Stage 5: RRF Fusion -->
  <rect x="484" y="442" width="106" height="48" rx="8" fill="#eff6ff" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="537" y="463" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">RRF Fusion</text>
  <text x="537" y="478" text-anchor="middle" font-size="8.5" fill="#7c3aed">k=60 → pool 40</text>

  <!-- Stage 5: MMR Diversity -->
  <rect x="610" y="442" width="106" height="48" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="663" y="463" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">MMR Diversity</text>
  <text x="663" y="478" text-anchor="middle" font-size="8.5" fill="#64748b">λ=0.5 → 12 cands</text>

  <!-- Stage 5: Cross-Encoder Rerank -->
  <rect x="736" y="442" width="116" height="48" rx="8" fill="#eff6ff" stroke="#0891b2" stroke-width="1.3"/>
  <text x="794" y="463" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">Cross-Encoder</text>
  <text x="794" y="478" text-anchor="middle" font-size="8.5" fill="#0891b2">bge-rerank → top 6</text>

  <!-- Stage 6: Generation with Citations -->
  <rect x="872" y="442" width="124" height="48" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
  <text x="934" y="463" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">LLM Generation</text>
  <text x="934" y="478" text-anchor="middle" font-size="8.5" fill="#16a34a">inline [chunk_id]</text>

  <!-- Stage 7: Guard Decision Diamond -->
  <path d="M1020,466 L1058,436 L1096,466 L1058,496 z" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="1058" y="462" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5b21b6">2-Stage</text>
  <text x="1058" y="474" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5b21b6">Guard?</text>

  <!-- Terminal 1: Verified Answer (Pass) -->
  <rect x="1132" y="388" width="112" height="42" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="1188" y="408" text-anchor="middle" font-size="10.5" font-weight="700" fill="#166534">✓ Verified</text>
  <text x="1188" y="421" text-anchor="middle" font-size="8.5" font-weight="600" fill="#16a34a">Citations Entailed</text>

  <!-- Terminal 2: Honest Refusal (Fail) -->
  <rect x="1132" y="456" width="112" height="42" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="1188" y="476" text-anchor="middle" font-size="10.5" font-weight="700" fill="#991b1b">✗ Refusal</text>
  <text x="1188" y="489" text-anchor="middle" font-size="8.5" font-weight="600" fill="#dc2626">Premise Rejected</text>

  <!-- Retry Box (Widened Loop) -->
  <rect x="886" y="556" width="154" height="40" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
  <text x="963" y="573" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Retry Once (Widened)</text>
  <text x="963" y="587" text-anchor="middle" font-size="8.5" font-weight="600" fill="#d97706">2× pool · MMR disabled</text>

  <!-- ──── ROW 2 CONNECTORS & FLOW ──── -->
  <!-- Start → Ask Question -->
  <line x1="62" y1="466" x2="74" y2="466" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- Ask Question → Embed Question -->
  <line x1="174" y1="466" x2="194" y2="466" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- Embed Question → Fork Point -->
  <line x1="302" y1="466" x2="318" y2="466" stroke="#64748b" stroke-width="1.4"/>
  <path d="M318,431 L318,501" fill="none" stroke="#64748b" stroke-width="1.4"/>
  <circle cx="318" cy="466" r="2.5" fill="#64748b"/>
  <line x1="318" y1="431" x2="336" y2="431" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="318" y1="497" x2="336" y2="497" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- Dense & Sparse Search → Join Point -->
  <line x1="454" y1="431" x2="468" y2="431" stroke="#64748b" stroke-width="1.4"/>
  <line x1="454" y1="497" x2="468" y2="497" stroke="#64748b" stroke-width="1.4"/>
  <path d="M468,431 L468,501" fill="none" stroke="#64748b" stroke-width="1.4"/>
  <circle cx="468" cy="466" r="2.5" fill="#64748b"/>
  <line x1="468" y1="466" x2="484" y2="466" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- RRF → MMR → Rerank → Generate → Guard -->
  <line x1="590" y1="466" x2="610" y2="466" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="716" y1="466" x2="736" y2="466" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="852" y1="466" x2="872" y2="466" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="996" y1="466" x2="1020" y2="466" stroke="#64748b" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- Guard PASS → Verified Answer (Top Branch) -->
  <path d="M1058,436 L1058,409 L1132,409" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#agreen)"/>
  <text x="1066" y="424" font-size="8.5" font-weight="700" fill="#16a34a">Pass (Entail ≥ 0.50)</text>

  <!-- Guard FAIL Final → Refusal (Right Branch) -->
  <line x1="1096" y1="466" x2="1132" y2="466" stroke="#dc2626" stroke-width="1.6" marker-end="url(#ared)"/>
  <text x="1098" y="458" font-size="8.5" font-weight="700" fill="#dc2626">Fail</text>

  <!-- Guard 1st FAIL → Retry Box (Bottom Branch) -->
  <path d="M1058,496 L1058,576 L1040,576" fill="none" stroke="#d97706" stroke-width="1.4" marker-end="url(#aamber)"/>
  <text x="1066" y="525" font-size="8.5" font-weight="700" fill="#d97706">1st Fail</text>

  <!-- Retry Box → Loop back to Retrieval Fork (Clear Corridor at y=576) -->
  <path d="M886,576 L318,576 L318,512" fill="none" stroke="#d97706" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#aamber)"/>
  <text x="600" y="569" text-anchor="middle" font-size="8.5" font-weight="700" fill="#d97706">Widened Retrieval Loop: Expands Candidate Pool &amp; Retries Query</text>

  <!-- ========================================================================= -->
  <!-- ════════════════════ FOOTER SUMMARY ═════════════════════════════════════ -->
  <!-- ========================================================================= -->
  <text x="640" y="704" text-anchor="middle" font-size="10.5" font-weight="500" fill="#94a3b8">Stages 1–4 run once per repository · Stages 5–7 execute per question and never touch GitHub</text>
</svg>
