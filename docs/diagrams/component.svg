<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#64748b" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect width="1000" height="800" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">RepoMind — Component / Package Diagram</text>
  <text x="500" y="52" text-anchor="middle" font-size="11.5" fill="#64748b">boxes are Python packages · every arrow is an import that exists in the code</text>

  <rect x="30" y="76" width="650" height="480" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="46" y="98" font-size="12" font-weight="700" fill="#475569">Live application (streamlit run app.py)</text>

  <g text-anchor="middle" fill="#0f172a">
    <rect x="60" y="108" width="360" height="52" rx="7" fill="#eef2ff" stroke="#4338ca" stroke-width="1.6"/>
    <text x="240" y="128" font-size="9.5" font-style="italic" fill="#4338ca">«composition root»</text>
    <text x="240" y="146" font-size="12.5" font-weight="700">app.py</text>

    <rect x="60" y="192" width="150" height="52" rx="7" fill="#fff" stroke="#334155" stroke-width="1.4"/>
    <text x="135" y="213" font-size="11.5" font-weight="600">query_pipeline</text>
    <text x="135" y="230" font-size="9.5" fill="#64748b">orchestrates one query</text>

    <rect x="230" y="192" width="150" height="52" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
    <text x="305" y="213" font-size="11.5" font-weight="600">retrieval/</text>
    <text x="305" y="230" font-size="9.5" fill="#64748b">RRF · MMR · rerank</text>

    <rect x="400" y="192" width="150" height="52" rx="7" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
    <text x="475" y="213" font-size="11.5" font-weight="600">generation/</text>
    <text x="475" y="230" font-size="9.5" fill="#64748b">prompt · answerer</text>

    <rect x="60" y="284" width="150" height="52" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
    <text x="135" y="305" font-size="11.5" font-weight="600">guard/</text>
    <text x="135" y="322" font-size="9.5" fill="#64748b">references · NLI</text>

    <rect x="230" y="284" width="150" height="52" rx="7" fill="#ecfeff" stroke="#0891b2" stroke-width="1.4"/>
    <text x="305" y="305" font-size="11.5" font-weight="600">index/</text>
    <text x="305" y="322" font-size="9.5" fill="#64748b">Chroma · BM25</text>

    <rect x="400" y="284" width="150" height="52" rx="7" fill="#fff" stroke="#334155" stroke-width="1.4"/>
    <text x="475" y="305" font-size="11.5" font-weight="600">jobs/</text>
    <text x="475" y="322" font-size="9.5" fill="#64748b">runner · lock · status</text>

    <rect x="60" y="376" width="150" height="52" rx="7" fill="#fff" stroke="#334155" stroke-width="1.4"/>
    <text x="135" y="397" font-size="11.5" font-weight="600">core/</text>
    <text x="135" y="414" font-size="9.5" fill="#64748b">manifest · context</text>

    <rect x="230" y="376" width="150" height="52" rx="7" fill="#fff" stroke="#334155" stroke-width="1.4"/>
    <text x="305" y="397" font-size="11.5" font-weight="600">ingest/</text>
    <text x="305" y="414" font-size="9.5" fill="#64748b">REST + GraphQL</text>

    <rect x="400" y="376" width="150" height="52" rx="7" fill="#fff" stroke="#334155" stroke-width="1.4"/>
    <text x="475" y="397" font-size="11.5" font-weight="600">process/</text>
    <text x="475" y="414" font-size="9.5" fill="#64748b">chunker · linker</text>

    <rect x="60" y="468" width="320" height="52" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/>
    <text x="220" y="489" font-size="11.5" font-weight="600">config.py · providers.py</text>
    <text x="220" y="506" font-size="9.5" fill="#64748b">imported by nearly every module — edges omitted</text>

    <rect x="400" y="468" width="150" height="52" rx="7" fill="#fff" stroke="#334155" stroke-width="1.4"/>
    <text x="475" y="489" font-size="11.5" font-weight="600">telemetry.py</text>
    <text x="475" y="506" font-size="9.5" fill="#64748b">per-query metrics</text>
  </g>

  <!-- offline boundary -->
  <rect x="710" y="76" width="260" height="220" rx="10" fill="#fffbeb" stroke="#d97706" stroke-dasharray="6 4"/>
  <text x="726" y="98" font-size="12" font-weight="700" fill="#92400e">Offline only — never imported</text>

  <rect x="736" y="112" width="212" height="52" rx="7" fill="#fff" stroke="#d97706" stroke-width="1.4"/>
  <text x="842" y="133" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">eval/</text>
  <text x="842" y="150" text-anchor="middle" font-size="9.5" fill="#64748b">golden sets · metrics · ablation</text>

  <rect x="736" y="188" width="212" height="52" rx="7" fill="#fff" stroke="#d97706" stroke-width="1.4"/>
  <text x="842" y="209" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">scripts/</text>
  <text x="842" y="226" text-anchor="middle" font-size="9.5" fill="#64748b">smoke_test · check_providers</text>

  <text x="726" y="264" font-size="10" fill="#92400e">Both import freely from the live application.</text>
  <text x="726" y="279" font-size="10" fill="#92400e">Nothing imports back — that is the rule.</text>

  <!-- forbidden edge -->
  <path d="M736,138 L700,138 L700,310 L560,310" fill="none" stroke="#dc2626"
        stroke-width="1.8" stroke-dasharray="6 4"/>
  <circle cx="700" cy="228" r="13" fill="#fff" stroke="#dc2626" stroke-width="2"/>
  <line x1="691" y1="219" x2="709" y2="237" stroke="#dc2626" stroke-width="2"/>

  <rect x="710" y="330" width="260" height="96" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="4 3"/>
  <text x="726" y="352" font-size="11.5" font-weight="700" fill="#dc2626">Forbidden dependency</text>
  <text x="726" y="372" font-size="10" fill="#991b1b">No live module may import eval/ or scripts/.</text>
  <text x="726" y="390" font-size="10" fill="#991b1b">The in-app evaluation panel runs eval/run.py</text>
  <text x="726" y="405" font-size="10" fill="#991b1b">as a subprocess to preserve this. Delete eval/</text>
  <text x="726" y="420" font-size="10" fill="#991b1b">entirely and the app still runs — that is the test.</text>

  <!-- external -->
  <rect x="710" y="454" width="260" height="46" rx="7" fill="#fff" stroke="#0f172a" stroke-width="1.3"/>
  <text x="840" y="474" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">«external» GitHub API</text>
  <text x="840" y="490" text-anchor="middle" font-size="9.5" fill="#64748b">REST + GraphQL</text>

  <rect x="710" y="512" width="260" height="46" rx="7" fill="#fff" stroke="#0f172a" stroke-width="1.3"/>
  <text x="840" y="532" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">«external» Ollama</text>
  <text x="840" y="548" text-anchor="middle" font-size="9.5" fill="#64748b">embeddings · local generation</text>

  <rect x="710" y="570" width="260" height="46" rx="7" fill="#fff" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="840" y="590" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">«optional» Cloud LLM</text>
  <text x="840" y="606" text-anchor="middle" font-size="9.5" fill="#64748b">falls back to Ollama on any failure</text>

  <!-- ===== real import edges ===== -->
  <g stroke="#64748b" stroke-width="1.4" fill="none" stroke-dasharray="5 4">
    <line x1="135" y1="160" x2="135" y2="192" marker-end="url(#a)"/>
    <line x1="305" y1="160" x2="305" y2="192" marker-end="url(#a)"/>
    <path d="M400,160 L400,176 L475,176 L475,192" marker-end="url(#a)"/>

    <line x1="135" y1="244" x2="135" y2="284" marker-end="url(#a)"/>
    <path d="M210,310 L222,310 L222,264 L475,264 L475,244" marker-end="url(#a)"/>

    <line x1="305" y1="244" x2="305" y2="284" marker-end="url(#a)"/>

    <line x1="400" y1="304" x2="380" y2="304" marker-end="url(#a)"/>
    <line x1="475" y1="336" x2="475" y2="376" marker-end="url(#a)"/>
    <path d="M420,336 L420,356 L305,356 L305,376" marker-end="url(#a)"/>

    <path d="M230,402 L210,402" marker-end="url(#a)"/>
  </g>

  <rect x="30" y="600" width="650" height="176" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="46" y="624" font-size="12" font-weight="700" fill="#0f172a">Why retrieval/ does not point at generation/</text>
  <text x="46" y="646" font-size="10.5" fill="#475569">There is no such import. <tspan font-family="ui-monospace, monospace">app.py</tspan> is the composition root: it constructs Retriever,</text>
  <text x="46" y="661" font-size="10.5" fill="#475569">Answerer and NLIVerifier, then hands all three to <tspan font-family="ui-monospace, monospace">query_pipeline.answer_query()</tspan> as</text>
  <text x="46" y="676" font-size="10.5" fill="#475569">arguments. The pipeline stages are sequenced at runtime, not wired at import time —</text>
  <text x="46" y="691" font-size="10.5" fill="#475569">which is why each one can be swapped in tests and in the ablation.</text>
  <text x="46" y="716" font-size="10.5" fill="#475569"><tspan font-weight="700">The one edge that surprises people:</tspan> <tspan font-family="ui-monospace, monospace">guard/</tspan> imports <tspan font-family="ui-monospace, monospace">generation/</tspan>. Both guard stages must</text>
  <text x="46" y="731" font-size="10.5" fill="#475569">agree on what a citation looks like, so they share one regular expression rather than</text>
  <text x="46" y="746" font-size="10.5" fill="#475569">keeping two definitions that can drift apart.</text>
  <text x="46" y="766" font-size="10" fill="#94a3b8">Edges into config.py, providers.py and core/ are omitted: nearly every module imports them.</text>
</svg>
